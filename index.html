<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="google-site-verification" content="KrbT-SoFa0ArKD_ZVTAZoJ5a56Qgx6u8xwtlDPLSaTE" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ભારત ન્યૂઝ - તાજા માર્કેટ અપડેટ્સ (હિન્દી)</title>
    <meta name="description" content="ભારત ન્યૂઝ - શેર બજાર, બિઝનેસ અને અર્થતંત્રની તાજી હિન્દીમાં અપડેટ્સ">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Noto Sans Devanagari', 'Poppins', sans-serif; 
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container { max-width: 900px; margin: auto; }
        
        .header {
            text-align: center;
            padding: 30px 20px;
            margin-bottom: 25px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .header h1 {
            font-size: 32px;
            background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }
        
        .header p { color: #a0a0a0; font-size: 14px; }
        
        .live-badge {
            display: inline-block;
            background: #ff4757;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 10px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        
        .news-card {
            background: rgba(255, 255, 255, 0.07);
            border-left: 4px solid #ff6b6b;
            padding: 20px 22px;
            margin-bottom: 18px;
            border-radius: 12px;
            transition: all 0.3s ease;
            backdrop-filter: blur(8px);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .news-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(255, 107, 107, 0.2);
            border-left-color: #feca57;
            background: rgba(255, 255, 255, 0.1);
        }
        
        .news-title {
            font-size: 19px;
            font-weight: 600;
            color: #ffffff;
            line-height: 1.6;
            margin-bottom: 14px;
        }
        
        .news-summary {
            font-size: 15px;
            color: #b0b0b0;
            line-height: 1.7;
            margin-bottom: 15px;
            padding-left: 10px;
            border-left: 2px solid #444;
        }
        
        .news-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .news-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(90deg, #ff6b6b, #ee5a6f);
            color: white;
            padding: 9px 18px;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .news-link:hover {
            background: linear-gradient(90deg, #feca57, #ff9f43);
            transform: scale(1.05);
        }
        
        /* Share Buttons */
        .share-buttons {
            display: flex;
            gap: 8px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        .share-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            text-decoration: none;
            font-size: 18px;
            transition: all 0.3s ease;
            color: white;
        }
        
        .share-btn:hover {
            transform: translateY(-3px) scale(1.1);
        }
        
        .share-whatsapp { background: #25D366; }
        .share-whatsapp:hover { box-shadow: 0 5px 15px rgba(37, 211, 102, 0.4); }
        
        .share-telegram { background: #0088cc; }
        .share-telegram:hover { box-shadow: 0 5px 15px rgba(0, 136, 204, 0.4); }
        
        .share-facebook { background: #1877F2; }
        .share-facebook:hover { box-shadow: 0 5px 15px rgba(24, 119, 242, 0.4); }
        
        .share-twitter { background: #000; }
        .share-twitter:hover { box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4); }
        
        .share-label {
            font-size: 12px;
            color: #888;
            margin-right: 5px;
            align-self: center;
        }
        
        .source {
            font-size: 12px;
            color: #888;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .footer {
            text-align: center;
            padding: 25px;
            color: #888;
            font-size: 13px;
            margin-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            line-height: 2;
        }
        
        .footer a {
            color: #48dbfb;
            text-decoration: none;
            margin: 0 8px;
            transition: color 0.3s;
        }
        
        .footer a:hover {
            color: #feca57;
            text-decoration: underline;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
            font-size: 16px;
        }
        
        @media (max-width: 600px) {
            .header h1 { font-size: 24px; }
            .news-title { font-size: 16px; }
            .news-summary { font-size: 14px; }
            .news-meta { flex-direction: column; align-items: flex-start; }
            .footer a { display: block; margin: 5px 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📈 ભારત ન્યૂઝ</h1>
            <p>શેર બજાર અને બિઝનેસની તાજી હિન્દી અપડેટ્સ</p>
            <span class="live-badge">🔴 LIVE</span>
        </div>
        
        <div id="news-container">
            <div class="loading">⏳ ન્યૂઝ લોડ થઈ રહ્યા છે...</div>
        </div>
        
        <div class="footer">
            © 2026 ભારત ન્યૂઝ | સ્રોત: Moneycontrol<br>
            <a href="about.html">અમારા વિશે</a> | 
            <a href="privacy.html">ગોપનીયતા નીતિ</a> | 
            <a href="contact.html">સંપર્ક કરો</a>
            <br>
            આ વેબસાઈટ AI દ્વારા ઓટોમેટિક અપડેટ થાય છે.
        </div>
    </div>

    <script>
        fetch('news_data.json')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('news-container');
                container.innerHTML = '';
                
                if (data.length === 0) {
                    container.innerHTML = '<div class="loading">હાલમાં કોઈ ન્યૂઝ ઉપલબ્ધ નથી.</div>';
                    return;
                }
                
                data.forEach(news => {
                    const card = document.createElement('div');
                    card.className = 'news-card';
                    
                    // Share માટે title અને link encode કરો
                    const shareTitle = encodeURIComponent(news.title);
                    const shareUrl = encodeURIComponent(news.link);
                    
                    // સારાંશ હોય તો જ દેખાડો
                    const summaryHTML = news.summary ? 
                        `<p class="news-summary">${news.summary}...</p>` : '';
                    
                    card.innerHTML = `
                        <div class="news-title">${news.title}</div>
                        ${summaryHTML}
                        <div class="news-meta">
                            <a href="${news.link}" target="_blank" class="news-link">પૂરી ન્યૂઝ વાંચો →</a>
                            <span class="source">📰 સ્રોત: ${news.source} | 🕐 ${news.date}</span>
                        </div>
                        <div class="share-buttons">
                            <span class="share-label">શેર કરો:</span>
                            <a href="https://wa.me/?text=${shareTitle}%20-%20${shareUrl}" target="_blank" class="share-btn share-whatsapp" title="WhatsApp પર શેર કરો">📱</a>
                            <a href="https://t.me/share/url?url=${shareUrl}&text=${shareTitle}" target="_blank" class="share-btn share-telegram" title="Telegram પર શેર કરો">✈️</a>
                            <a href="https://www.facebook.com/sharer/sharer.php?u=${shareUrl}" target="_blank" class="share-btn share-facebook" title="Facebook પર શેર કરો">📘</a>
                            <a href="https://twitter.com/intent/tweet?text=${shareTitle}&url=${shareUrl}" target="_blank" class="share-btn share-twitter" title="X (Twitter) પર શેર કરો">𝕏</a>
                        </div>
                    `;
                    container.appendChild(card);
                });
            })
            .catch(error => {
                document.getElementById('news-container').innerHTML = 
                    '<div class="loading">❌ ન્યૂઝ લોડ કરવામાં સમસ્યા આવી.</div>';
                console.error('Error:', error);
            });
    </script>
</body>
</html>
