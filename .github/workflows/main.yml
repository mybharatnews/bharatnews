name: Auto Market News Update

on:
  schedule:
    # દર 30 મિનિટે ઓટોમેટિક ચાલશે
    - cron: '*/30 * * * *'
  workflow_dispatch: # તમે જાતે પણ ચાલુ કરી શકો છો

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install feedparser deep-translator
      - name: Run script
        run: python news_fetcher.py
      - name: Run script
        run: python news_fetcher.py
        continue-on-error: true
      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add news_data.json
          git commit -m "Auto-update news data" || exit 0
          git push
