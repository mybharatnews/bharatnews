name: Auto Market News Update

on:
  schedule:
    # દર 2 કલાકે (IST)
    # IST = UTC + 5:30
    - cron: '0 19 * * *'   # 00:30 IST
    - cron: '0 21 * * *'   # 02:30 IST
    - cron: '0 23 * * *'   # 04:30 IST
    - cron: '0 1 * * *'    # 06:30 IST
    - cron: '0 3 * * *'    # 08:30 IST
    - cron: '0 5 * * *'    # 10:30 IST
    - cron: '0 7 * * *'    # 12:30 IST
    - cron: '0 9 * * *'    # 14:30 IST
    - cron: '0 11 * * *'   # 16:30 IST
    - cron: '0 13 * * *'   # 18:30 IST
    - cron: '0 15 * * *'   # 20:30 IST
    - cron: '0 17 * * *'   # 22:30 IST
  workflow_dispatch:

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install feedparser deep-translator requests

      - name: Run news fetcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python news_fetcher.py
        continue-on-error: true

      - name: Generate News Pages
        run: python generate_pages.py
        continue-on-error: true

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add news_data.json sent_news.json
          git add news/ news_index.json sitemap.xml 2>/dev/null || true
          git commit -m "Auto-update news and pages" || exit 0
          git push
