name: Auto Market News Update

on:
  schedule:
    # દર 3 કલાકે (IST)
    # IST = UTC + 5:30
    - cron: '30 18 * * *'   # 00:00 IST
    - cron: '30 21 * * *'   # 03:00 IST
    - cron: '30 0 * * *'    # 06:00 IST
    - cron: '30 3 * * *'    # 09:00 IST
    - cron: '30 6 * * *'    # 12:00 IST
    - cron: '30 9 * * *'    # 15:00 IST
    - cron: '30 12 * * *'   # 18:00 IST
    - cron: '30 15 * * *'   # 21:00 IST
  workflow_dispatch:

# repo માં write permission જરૂરી છે push માટે
permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run news fetcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python news_fetcher.py
        continue-on-error: true

      - name: Generate News Pages
        run: python generate_pages.py
        continue-on-error: true

      - name: Commit and Push changes
        id: commit
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add news_data.json sent_news.json 2>/dev/null || true
          git add news/ news_index.json sitemap.xml rss.xml 2>/dev/null || true
          git commit -m "Auto-update news, pages, sitemap and RSS" || exit 0
          git pull --rebase origin main || true
          git push
          echo "pushed=true" >> $GITHUB_OUTPUT

      # 👇 નવું: GitHub Pages deploy થવા માટે wait કરો
      - name: Wait for GitHub Pages deployment
        if: steps.commit.outputs.pushed == 'true'
        run: sleep 60

      # 👇 નવું: IndexNow ને બધા URLs ping કરો (Bing, Yandex, Seznam)
      - name: Submit URLs to IndexNow
        if: steps.commit.outputs.pushed == 'true'
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          python - <<'PYEOF'
          import os
          import re
          import requests
          
          key = os.environ.get('INDEXNOW_KEY', '').strip()
          if not key:
              print("⚠️ INDEXNOW_KEY secret not set. Skipping IndexNow.")
              exit(0)
          
          host = "mybharatnews.github.io"
          sitemap_url = f"https://{host}/bharatnews/sitemap.xml"
          
          try:
              response = requests.get(sitemap_url, timeout=15)
              response.raise_for_status()
              urls = re.findall(r"<loc>(.*?)</loc>", response.text)
          except Exception as e:
              print(f"❌ Sitemap fetch failed: {e}")
              exit(0)
          
          if not urls:
              print("⚠️ No URLs found in sitemap.")
              exit(0)
          
          # IndexNow એક request માં max 10,000 URLs accept કરે છે
          urls = urls[:10000]
          print(f"📡 Submitting {len(urls)} URLs to IndexNow...")
          
          payload = {
              "host": host,
              "key": key,
              "keyLocation": f"https://{host}/bharatnews/{key}.txt",
              "urlList": urls
          }
          
          try:
              r = requests.post(
                  "https://api.indexnow.org/indexnow",
                  json=payload,
                  headers={"Content-Type": "application/json; charset=utf-8"},
                  timeout=30
              )
              print(f"✅ IndexNow response: {r.status_code}")
              if r.status_code in (200, 202):
                  print("🎉 URLs successfully submitted!")
              else:
                  print(f"Response body: {r.text[:300]}")
          except Exception as e:
              print(f"❌ IndexNow request failed: {e}")
          PYEOF

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=⚠️ Bharat News workflow failed at $(date +'%Y-%m-%d %H:%M IST')" \
            -d "parse_mode=HTML" || true
