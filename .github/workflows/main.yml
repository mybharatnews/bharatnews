name: Auto Market News Update

on:
  schedule:
    # દર 3 કલાકે (IST = UTC + 5:30)
    - cron: '30 18 * * *'   # 00:00 IST
    - cron: '30 21 * * *'   # 03:00 IST
    - cron: '30 0 * * *'    # 06:00 IST
    - cron: '30 3 * * *'    # 09:00 IST
    - cron: '30 6 * * *'    # 12:00 IST
    - cron: '30 9 * * *'    # 15:00 IST
    - cron: '30 12 * * *'   # 18:00 IST
    - cron: '30 15 * * *'   # 21:00 IST
  workflow_dispatch:

# repo માં write permission જરૂરી છે push માટે
permissions:
  contents: write

# ✅ એક જ સમયે એક જ run (manual + cron conflict ટાળવા)
concurrency:
  group: news-update
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      # ═══════════════════════════════════════════════════
      # 1. Checkout
      # ═══════════════════════════════════════════════════
      - name: Checkout code
        uses: actions/checkout@v4      # ✅ v4 (v5 અસ્તિત્વમાં નથી)

      # ═══════════════════════════════════════════════════
      # 2. Python setup
      # ═══════════════════════════════════════════════════
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ═══════════════════════════════════════════════════
      # 3. News fetch + pages generate
      # ═══════════════════════════════════════════════════
      - name: Run news fetcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python news_fetcher.py
        continue-on-error: true        # ✅ ફક્ત આ એક (network issues માટે)

      - name: Generate News Pages
        run: python generate_pages.py  # ❌ continue-on-error નહીં — fail થાય તો રોકો

      # ═══════════════════════════════════════════════════
      # 4. Generated files verify
      # ═══════════════════════════════════════════════════
      - name: Verify generated files
        run: |
          echo "📂 news/ folder:"
          ls -la news/ | head -10
          echo ""
          echo "📄 Root files:"
          ls -la *.html *.xml *.txt 2>/dev/null || true

          FAIL=0
          for f in index.html sitemap.xml news-sitemap.xml sitemap_index.xml robots.txt rss.xml news_index.json; do
            if [ ! -f "$f" ]; then
              echo "❌ Missing: $f"
              FAIL=1
            else
              echo "✅ Found: $f"
            fi
          done
          if [ "$FAIL" = "1" ]; then
            echo "❌ Required files missing — aborting"
            exit 1
          fi
          echo "✅ All required files present"

      # ═══════════════════════════════════════════════════
      # 5. Commit & Push
      # ═══════════════════════════════════════════════════
      - name: Commit and Push changes
        id: commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # ✅ પહેલા pull (autostash સાથે) — race condition ટાળો
          git pull --rebase --autostash origin main || true

          # ✅ બધું add કરો (new + modified + deleted)
          git add -A

          # ✅ કોઈ change ન હોય તો gracefully exit
          if git diff --cached --quiet; then
            echo "ℹ️ No changes to commit"
            echo "pushed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          TIMESTAMP=$(TZ='Asia/Kolkata' date +'%Y-%m-%d %H:%M IST')
          git commit -m "Auto-update news, pages, sitemap and RSS ($TIMESTAMP)"

          # ✅ push fail થાય તો workflow fail
          if git push; then
            echo "✅ Changes pushed successfully"
            echo "pushed=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Push failed"
            exit 1
          fi

      # ═══════════════════════════════════════════════════
      # 6. Wait for GitHub Pages deploy (retry loop)
      # ═══════════════════════════════════════════════════
      - name: Wait for GitHub Pages deployment
        if: steps.commit.outputs.pushed == 'true'
        run: |
          SITEMAP_URL="https://mybharatnews.github.io/bharatnews/sitemap.xml"
          for i in $(seq 1 12); do
            sleep 15
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SITEMAP_URL" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Site is live (attempt $i)"
              exit 0
            fi
            echo "⏳ Waiting for deployment... ($i/12, status=$STATUS)"
          done
          echo "⚠️ Site may not be fully deployed, continuing anyway"

      # ═══════════════════════════════════════════════════
      # 7. IndexNow Submit
      # ═══════════════════════════════════════════════════
      - name: Install IndexNow dependencies
        if: steps.commit.outputs.pushed == 'true'
        run: pip install requests

      - name: Submit URLs to IndexNow
        if: steps.commit.outputs.pushed == 'true'
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          python - <<'PYEOF'
          import os
          import re
          import requests

          key = os.environ.get('INDEXNOW_KEY', '').strip()
          if not key:
              print("⚠️ INDEXNOW_KEY secret not set. Skipping IndexNow.")
              exit(0)

          host = "mybharatnews.github.io"
          sitemap_url = f"https://{host}/bharatnews/sitemap.xml"

          # ─── Sitemap fetch ───
          try:
              response = requests.get(sitemap_url, timeout=15)
              response.raise_for_status()
              urls = re.findall(r"<loc>(.*?)</loc>", response.text)
          except Exception as e:
              print(f"❌ Sitemap fetch failed: {e}")
              exit(0)

          if not urls:
              print("⚠️ No URLs found in sitemap.")
              exit(0)

          # ─── Key file verify ───
          key_file_url = f"https://{host}/bharatnews/{key}.txt"
          try:
              kf = requests.get(key_file_url, timeout=10)
              if kf.status_code != 200:
                  print(f"⚠️ Key file not accessible: {key_file_url} (status {kf.status_code})")
                  print("   IndexNow key verification may fail. Make sure the file exists in repo.")
              else:
                  print(f"✅ Key file verified: {key_file_url}")
          except Exception as e:
              print(f"⚠️ Could not verify key file: {e}")

          # ─── Submit (max 10,000 URLs per request) ───
          urls = urls[:10000]
          print(f"📡 Submitting {len(urls)} URLs to IndexNow...")

          payload = {
              "host": host,
              "key": key,
              "keyLocation": key_file_url,
              "urlList": urls
          }

          try:
              r = requests.post(
                  "https://api.indexnow.org/indexnow",
                  json=payload,
                  headers={"Content-Type": "application/json; charset=utf-8"},
                  timeout=30
              )
              print(f"✅ IndexNow response: {r.status_code}")
              if r.status_code in (200, 202):
                  print("🎉 URLs successfully submitted!")
              else:
                  print(f"Response body: {r.text[:500]}")
          except Exception as e:
              print(f"❌ IndexNow request failed: {e}")
          PYEOF

      # ═══════════════════════════════════════════════════
      # 8. Notify on failure
      # ═══════════════════════════════════════════════════
      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "⚠️ Telegram secrets missing — skipping notification"
            exit 0
          fi
          TIMESTAMP=$(TZ='Asia/Kolkata' date +'%Y-%m-%d %H:%M IST')
          MSG="⚠️ Bharat News workflow failed at $TIMESTAMP"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" \
            -d "parse_mode=HTML" || true
