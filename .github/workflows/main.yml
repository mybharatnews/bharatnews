name: Auto Market News Update

on:
  schedule:
    # દર 30 મિનિટે ઓટોમેટિક ચાલશે
    - cron: '*/30 * * * *'
  workflow_dispatch: # તમે જાતે પણ ચાલુ કરી શકો છો

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install feedparser

      - name: Run script
        run: python news_fetcher.py
